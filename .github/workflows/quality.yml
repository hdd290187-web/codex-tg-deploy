name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-center.lock
            gateway/requirements.lock
            requirements-dev.lock
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-center.lock -r gateway/requirements.lock -r requirements-dev.lock
      - run: .venv/bin/ruff check gateway deployment-center release-tools tests
      - run: .venv/bin/python -m compileall -q gateway deployment-center release-tools
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python scripts/secret_scan.py
